name: Escalate overdue matches

# Calls /api/cron/escalate on a schedule. This replaces a Vercel Cron job: the
# Hobby plan only allows daily cron jobs, and a more frequent schedule in
# vercel.json makes every deployment fail. See docs/DEPLOYMENT.md.
#
# Requires two repository secrets:
#   SITE_URL     production origin, e.g. https://areus.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel environment

on:
  schedule:
    # GitHub runs schedules on a best-effort basis; runs can start late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escalate
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call escalation endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --max-time 60 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/escalate"
          echo
